<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><title>UZIA — Personal AI</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#151a27;--line:#2b3244;--text:#f2f4fb;--muted:#9ca7bd;--accent:#a397ff;--mint:#70e2d2;--danger:#ff8d9a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1c1c35,transparent 48%),var(--bg);color:var(--text);font:16px system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}.app{max-width:900px;margin:auto;min-height:100dvh;padding:14px;display:flex;flex-direction:column}header{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0 16px}.logo{width:46px;height:46px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(140deg,#b2a5ff,#586ed7);font-size:23px;font-weight:800}.brand{flex:1}.brand h1{margin:0;letter-spacing:3px;font-size:21px}.brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}.status{font-size:10px;letter-spacing:1px;border:1px solid var(--line);border-radius:25px;padding:7px;color:var(--mint)}.status.err{color:var(--danger)}.welcome{margin:18px 0;padding:17px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(135deg,#1b1c30,#121621)}.welcome h2{margin:0 0 6px;font-size:24px}.welcome p{margin:0;color:var(--muted);line-height:1.5;font-size:14px}.chat{flex:1;display:flex;flex-direction:column;gap:12px;padding:0 0 14px}.msg{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--panel)}.msg.user{align-self:flex-end;background:#292443;border-color:#49416c}.msg.bot{align-self:flex-start;border-top-left-radius:5px}.sender{display:block;font-size:10px;letter-spacing:1.2px;font-weight:800;color:var(--mint);margin-bottom:4px}.user .sender{color:#c5bdff}.note{font-size:12px;line-height:1.5;color:var(--muted);padding:5px 1px;overflow-wrap:anywhere}.note.err{color:var(--danger)}.composer{position:sticky;bottom:0;padding:10px 0 max(8px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--bg) 18%)}.entry{display:flex;gap:8px;align-items:flex-end;padding:8px;border:1px solid #394057;border-radius:18px;background:#151925}textarea{flex:1;min-width:0;min-height:44px;max-height:140px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:10px 5px;line-height:1.5;font:inherit;font-size:16px}button{font:inherit;cursor:pointer;touch-action:manipulation}.icon,.send,.tool{border:1px solid var(--line);border-radius:12px;min-height:44px;background:#202638;color:var(--text);padding:0 12px}.icon{width:44px;padding:0;font-size:19px}.icon.active{background:#582e45;color:#ffc1d0}.send{background:var(--accent);color:#141121;font-weight:800;border:0}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tool{min-height:36px;font-size:12px;color:var(--muted)}.settings{display:none;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:15px;background:var(--panel)}.settings.open{display:block}.settings label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}.settings select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#0d111a;color:var(--text)}.settings input[type=range]{width:100%;accent-color:var(--accent)}.settings input[type=checkbox]{accent-color:var(--accent)}.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:12px}.footer{text-align:center;color:#69748a;font-size:11px;padding:10px 0 0}button:disabled{opacity:.45;cursor:not-allowed}@media(max-width:500px){.app{padding:11px}.msg{max-width:95%}.brand h1{font-size:19px}.status{font-size:9px}}
</style></head><body><main class="app">
<header><div class="logo">U</div><div class="brand"><h1>UZIA</h1><p>Your personal AI companion</p></div><div id="status" class="status">READY</div></header>
<section class="welcome"><h2>Hey, Uzair.</h2><p>I'm here. Type a message or tap the microphone to talk to me.</p></section>
<section id="chat" class="chat" aria-live="polite"><div class="msg bot"><span class="sender">UZIA</span><div class="body">Hey, Uzair. What’s on your mind?</div></div></section>
<div id="note" class="note">First, set your Apps Script web-app URL in this file as described in the README.</div>
<section class="composer"><div class="entry"><button id="mic" class="icon" aria-label="Start voice input" title="Talk">🎙️</button><textarea id="input" rows="1" placeholder="Message UZIA…" aria-label="Message UZIA"></textarea><button id="send" class="send">Send</button></div>
<div class="tools"><button id="settingsBtn" class="tool">⚙ Voice settings</button><button id="testVoice" class="tool">▶ Test voice</button><button id="stopVoice" class="tool">■ Stop speaking</button><button id="clear" class="tool">Clear chat</button></div>
<section id="settings" class="settings"><strong>Voice settings</strong><label for="voice">Spoken voice</label><select id="voice"><option value="">Default device voice</option></select><label for="lang">Recognition language</label><select id="lang"><option value="en-US">English (US)</option><option value="en-GB">English (UK)</option><option value="en-IN">English (India)</option><option value="ur-PK">Urdu (Pakistan)</option></select><label class="check"><input id="speakReplies" type="checkbox" checked> Speak UZIA's replies aloud</label><label for="rate">Speaking speed: <span id="rateVal">1.0×</span></label><input id="rate" type="range" min="0.7" max="1.3" step="0.1" value="1"><label for="pitch">Pitch: <span id="pitchVal">1.0</span></label><input id="pitch" type="range" min="0.7" max="1.5" step="0.1" value="1"><label for="volume">Volume: <span id="volumeVal">100%</span></label><input id="volume" type="range" min="0" max="1" step="0.1" value="1"><button id="micCheck" class="tool" style="margin-top:12px">Check microphone permission</button></section><div class="footer">UZIA · Your assistant, your rules.</div></section></main>
<script>
'use strict';
// IMPORTANT: paste your existing Apps Script deployed web-app URL ending in /exec between the quotes.
const APPS_SCRIPT_URL = 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE';
const $=id=>document.getElementById(id);
let accessPassword = localStorage.getItem('uzia_access_password') || '';
 const HISTORY_KEY='uzia_voicefix_history_v1'; const SETTINGS_KEY='uzia_voicefix_settings_v1';
let recognition=null, listening=false, starting=false, sending=false, finalText='', voices=[]; let history=[];
let cfg={lang:'en-US',voice:'',speak:true,rate:1,pitch:1,volume:1};
try{cfg={...cfg,...JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}}catch(e){}
function status(s,err=false){$('status').textContent=s;$('status').className='status'+(err?' err':'')}
function note(s,err=false){$('note').textContent=s;$('note').className='note'+(err?' err':'')}
function saveCfg(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(cfg))}catch(e){}}
function saveHist(){try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-60)))}catch(e){}}
function add(role,text,save=true){const el=document.createElement('div');el.className='msg '+(role==='user'?'user':'bot');const s=document.createElement('span');s.className='sender';s.textContent=role==='user'?'YOU':'UZIA';const b=document.createElement('div');b.className='body';b.textContent=String(text??'');el.append(s,b);$('chat').append(el);el.scrollIntoView({behavior:'smooth',block:'nearest'});if(save){history.push({role:role==='user'?'user':'model',text:String(text??'')});history=history.slice(-60);saveHist()}return el}
function loadHist(){try{const h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');if(Array.isArray(h)&&h.length){history=h.slice(-60);$('chat').innerHTML='';history.forEach(m=>{const el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'bot');const s=document.createElement('span');s.className='sender';s.textContent=m.role==='user'?'YOU':'UZIA';const b=document.createElement('div');b.className='body';b.textContent=m.text||'';el.append(s,b);$('chat').append(el)})}}catch(e){history=[]}}
function resize(){const x=$('input');x.style.height='auto';x.style.height=Math.min(x.scrollHeight,140)+'px'}
function speechText(text){return String(text).replace(/\bU\s*Z\s*I\s*A\b/gi,'Oo-zee-ah').replace(/\bUZIA\b/gi,'Oo-zee-ah')}
function speak(text){if(!cfg.speak||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(speechText(text));u.rate=+cfg.rate;u.pitch=+cfg.pitch;u.volume=+cfg.volume;const v=voices.find(v=>v.name===cfg.voice);if(v)u.voice=v;else u.lang=cfg.lang||'en-US';speechSynthesis.speak(u)}catch(e){note('Speech playback failed: '+e.message,true)}}
function loadVoices(){if(!('speechSynthesis'in window))return;voices=speechSynthesis.getVoices();const sel=$('voice');const old=cfg.voice;sel.innerHTML='<option value="">Default device voice</option>';voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name+' ('+v.lang+')';sel.append(o)});sel.value=voices.some(v=>v.name===old)?old:''}
function initRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('mic').disabled=true;note('This browser does not support speech recognition here. Try the latest Chrome, or type messages.',true);return}recognition=new SR();recognition.continuous=false;recognition.interimResults=true;recognition.maxAlternatives=1;recognition.onstart=()=>{starting=false;listening=true;$('mic').classList.add('active');$('mic').textContent='■';status('LISTENING');note('Listening… speak now, then pause.');};recognition.onresult=e=>{let interim='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0]?.transcript||'';if(e.results[i].isFinal)finalText+=t;else interim+=t}$('input').value=(finalText+' '+interim).trim();resize()};recognition.onerror=e=>{starting=false;listening=false;$('mic').classList.remove('active');$('mic').textContent='🎙️';status('MIC ERROR',true);const m={'not-allowed':'Microphone access was denied. Check site permission and your device settings.','service-not-allowed':'The browser speech-recognition service is blocked or unavailable.','audio-capture':'No working microphone was found.','network':'Speech recognition service network error. Check your connection.','no-speech':'No speech detected. Tap the mic and try again.','language-not-supported':'This recognition language is not supported by this browser.'};note(m[e.error]||('Speech recognition error: '+e.error),true)};recognition.onend=()=>{starting=false;const hadFinal=finalText.trim();listening=false;$('mic').classList.remove('active');$('mic').textContent='🎙️';if($('status').textContent!=='MIC ERROR')status('READY');if(hadFinal){$('input').value=hadFinal;send(hadFinal)}else if($('status').textContent!=='MIC ERROR')note('No final speech captured. Tap the mic and try again.')};}
function startMic(){if(!recognition){note('Speech recognition is unavailable in this browser. You can still type.',true);return}if(listening||starting){try{recognition.stop()}catch(e){}return}if(sending){note('Wait for UZIA to finish responding first.');return}if(!window.isSecureContext){note('Open this page through its HTTPS GitHub Pages address.',true);return}finalText='';$('input').value='';resize();try{starting=true;recognition.lang=cfg.lang||'en-US';recognition.start();note('Requesting microphone…')}catch(e){starting=false;note('Could not start microphone: '+e.message+'. Wait a moment and tap once again.',true);status('MIC ERROR',true)}}
function jsonp(message, prior){return new Promise((resolve,reject)=>{if(!APPS_SCRIPT_URL.startsWith('https://script.google.com/')||APPS_SCRIPT_URL.includes('PASTE_YOUR')){reject(new Error('Apps Script URL is not configured. Follow README step 4.'));return}const cb='uziaCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);const script=document.createElement('script');let done=false;const cleanup=()=>{if(done)return;done=true;clearTimeout(timer);script.remove();try{delete window[cb]}catch(e){window[cb]=undefined}};const timer=setTimeout(()=>{cleanup();reject(new Error('Timed out connecting to Apps Script. Check the deployment URL and internet connection.'))},90000);window[cb]=data=>{cleanup();if(!data||!data.ok)reject(new Error(data?.error||'Apps Script returned an unknown error'));else resolve(data.reply)};const params=new URLSearchParams({api:'1',callback:cb,password:accessPassword,message:message,history:JSON.stringify(prior.slice(-12))});script.src=APPS_SCRIPT_URL+'?'+params.toString();script.onerror=()=>{cleanup();reject(new Error('Could not load the Apps Script endpoint. Verify the /exec URL and redeploy the updated Code.gs.'))};document.body.appendChild(script)})}
async function send(override){if(sending)return;const text=String(override??$('input').value).trim();if(!text)return;if(!APPS_SCRIPT_URL.startsWith('https://script.google.com/')||APPS_SCRIPT_URL.includes('PASTE_YOUR')){note('First paste your Apps Script /exec URL into APPS_SCRIPT_URL near the top of this file.',true);return}if(!accessPassword){accessPassword=prompt('Enter the UZIA access password you saved in Apps Script Script Properties: UZIA_ACCESS_PASSWORD')||'';if(!accessPassword){note('The UZIA access password is required to protect your backend.',true);return}localStorage.setItem('uzia_access_password',accessPassword)}if(listening||starting){try{recognition.stop()}catch(e){} }
sending=true;$('send').disabled=true;$('input').disabled=true;$('mic').disabled=true;$('input').value='';resize();add('user',text);status('THINKING');note('UZIA is thinking…');const prior=history.slice(0,-1).slice(-12);const typing=add('model','UZIA is thinking…',false);try{const reply=await jsonp(text,prior);typing.querySelector('.body').textContent=String(reply);history.push({role:'model',text:String(reply)});history=history.slice(-60);saveHist();speak(reply);status('READY');note('Ready when you are.')}catch(e){typing.querySelector('.body').textContent='I could not connect to my brain.\n\n'+e.message;status('CONNECTION ERROR',true);note(e.message,true)}finally{sending=false;$('send').disabled=false;$('input').disabled=false;$('mic').disabled=!recognition;$('input').focus()}}
$('mic').addEventListener('click',startMic);$('send').addEventListener('click',()=>send());$('input').addEventListener('input',resize);$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('settingsBtn').onclick=()=>$('settings').classList.toggle('open');$('testVoice').onclick=()=>speak('Hello Uzair. I am Oo-zee-ah. Your voice settings are working.');$('stopVoice').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();note('Speech stopped.')};$('clear').onclick=()=>{history=[];saveHist();$('chat').innerHTML='';add('model','Fresh start, Uzair. What would you like to talk about?');note('Chat history cleared in this browser.')};$('micCheck').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia){note('Microphone permission test is unavailable in this browser. Use the HTTPS GitHub Pages URL.',true);return}try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop());status('MIC OK');note('The page can access the microphone. Tap the mic to test speech recognition.')}catch(e){status('MIC ERROR',true);note(({NotAllowedError:'Permission denied. Allow microphone for the GitHub Pages site and Chrome in device settings.',NotFoundError:'No microphone was detected.',NotReadableError:'The microphone may be in use by another app.'})[e.name]||('Microphone test failed: '+e.name+' '+e.message),true)}};
$('voice').onchange=()=>{cfg.voice=$('voice').value;saveCfg()};$('lang').value=cfg.lang;$('lang').onchange=()=>{cfg.lang=$('lang').value;saveCfg()};$('speakReplies').checked=cfg.speak;$('speakReplies').onchange=()=>{cfg.speak=$('speakReplies').checked;saveCfg();if(!cfg.speak&&'speechSynthesis'in window)speechSynthesis.cancel()};for(const [id,key,label] of [['rate','rate','rateVal'],['pitch','pitch','pitchVal'],['volume','volume','volumeVal']]){$(id).value=cfg[key];$(id).oninput=()=>{cfg[key]=+$(id).value;$(label).textContent=key==='rate'?cfg.rate.toFixed(1)+'×':key==='pitch'?cfg.pitch.toFixed(1):Math.round(cfg.volume*100)+'%';saveCfg()}};$('rateVal').textContent=cfg.rate.toFixed(1)+'×';$('pitchVal').textContent=cfg.pitch.toFixed(1);$('volumeVal').textContent=Math.round(cfg.volume*100)+'%';loadHist();loadVoices();if('speechSynthesis'in window)speechSynthesis.onvoiceschanged=loadVoices;initRecognition();if(!window.isSecureContext)note('This page must be opened through its HTTPS GitHub Pages URL.',true);
</script></body></html>
